<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2E" />
    <meta name="description" content="حماية | نظام مكافحة سرقة الأجهزة — منصة إدارة دورة حياة الأجهزة والبلاغات" />
    <title>حماية | نظام مكافحة سرقة الأجهزة</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- إعدادات الاتصال العامة: يجب تحميلها قبل وحدة التطبيق -->
    <script src="./config.js"></script>
    <style>
      /* شاشة إقلاع الهوية — أنماط مضمّنة لأنها يجب أن تظهر حتى لو فشل تحميل الحزمة */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0B3D2E; color: #ffffff;
        font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
        direction: rtl; text-align: center;
      }
      #boot .boot-card {
        display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px;
      }
      #boot .boot-logo {
        width: 96px; height: 96px; border-radius: 50%;
        background: #ffffff; display: flex; align-items: center; justify-content: center;
        overflow: hidden; box-shadow: 0 6px 22px rgba(0,0,0,0.25);
      }
      #boot .boot-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #boot .boot-title { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
      #boot .boot-sub { font-size: 14px; color: rgba(255,255,255,0.75); }
      #boot .boot-spinner {
        margin-top: 6px; width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.25); border-top-color: #C9A24D;
        animation: himaya-spin 0.9s linear infinite;
      }
      #boot .boot-error {
        max-width: 420px; padding: 24px; border-radius: 14px;
        background: #0B3D2E; border: 1px solid rgba(201,162,77,0.4);
      }
      #boot .boot-error h2 { color: #C9A24D; margin: 0 0 10px; font-size: 20px; }
      #boot .boot-error p { color: rgba(255,255,255,0.85); font-size: 14px; line-height: 1.8; margin: 0 0 18px; }
      #boot .boot-btn {
        display: inline-block; padding: 11px 22px; border: 0; border-radius: 10px;
        background: #C9A24D; color: #0B3D2E; font-size: 15px; font-weight: 700;
        cursor: pointer; font-family: inherit;
      }
      #boot .boot-btn:hover { background: #d8b45e; }
      @keyframes himaya-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="./assets/index-1IFjMsbm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-leEWFMW3.css">
  </head>
  <body>
    <a class="skip-link" href="#main">تخطٍّ إلى المحتوى الرئيسي</a>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-logo"><img src="./logo.png" alt="" onerror="this.parentNode.textContent='ح'" /></div>
        <div class="boot-title">حماية</div>
        <div class="boot-sub">نظام مكافحة سرقة الأجهزة</div>
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      /* حارس إقلاع — يعمل قبل وحدة التطبيق، يلتقط فشل تحميل الأصول ويعيد التعافي من الكاش القديم */
      (function () {
        var AUTO_KEY = 'himaya:auto-recover';

        // أداة التعافي الجذري: إلغاء كل Service Workers ومسح كل الكاشات ثم إعادة تحميل
        window.__himayaRecover = function () {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if (window.caches && typeof caches.keys === 'function') {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (e) {}
          // إعادة تحميل بمعامل جديد لتجاوز أي توجيه مخزّن؛ مع مؤقّت احتياطي
          setTimeout(function () {
            try { location.replace(location.pathname + '?fresh=' + Date.now()); } catch (e) {}
          }, 2500);
        };

        // رصد فشل تحميل SCRIPT/LINK → تعافٍ تلقائي مرة واحدة فقط (حتى لا تحدث حلقة)
        window.addEventListener('error', function (ev) {
          var t = ev.target;
          var isResource = t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK');
          if (!isResource) return;
          if (window.__HIMAYA_BOOTED__) return;
          var already = false;
          try { already = sessionStorage.getItem(AUTO_KEY) === '1'; } catch (e) {}
          if (already) return;
          try { sessionStorage.setItem(AUTO_KEY, '1'); } catch (e) {}
          window.__himayaRecover();
        }, true);

        // مؤقّت أمان: إن لم تكتمل الإقلاع خلال 8 ثوانٍ أظهر شاشة خطأ عربية
        setTimeout(function () {
          if (window.__HIMAYA_BOOTED__) return;
          var boot = document.getElementById('boot');
          if (!boot) return;
          boot.innerHTML =
            '<div class="boot-error" role="alert">' +
            '<h2>تعذّر تشغيل التطبيق</h2>' +
            '<p>يبدو أن الموقع يعرض نسخة قديمة من الذاكرة المؤقتة (الكاش) أو أن الأصول لم تُحمَّل. ' +
            'امسح الذاكرة المؤقتة وأعد التحميل للمتابعة.</p>' +
            '<button type="button" class="boot-btn" id="himaya-clear-btn">مسح الذاكرة المؤقتة وإعادة التحميل</button>' +
            '</div>';
          var btn = document.getElementById('himaya-clear-btn');
          if (btn) btn.addEventListener('click', function () { window.__himayaRecover(); });
        }, 8000);

        // إزالة شاشة الإقلاع بمجرد ظهور المحتوى في #root أو ضبط علم الإقلاع
        var tick = setInterval(function () {
          var root = document.getElementById('root');
          if (window.__HIMAYA_BOOTED__ || (root && root.childElementCount > 0)) {
            var b = document.getElementById('boot');
            if (b) b.remove();
            clearInterval(tick);
          }
        }, 200);
      })();
    </script>
  </body>
</html>
