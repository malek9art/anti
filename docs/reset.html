<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2E" />
    <title>إعادة تعيين | حماية</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #0B3D2E; color: #ffffff;
        font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
        direction: rtl; text-align: center; padding: 24px;
      }
      .card { max-width: 440px; width: 100%; }
      .logo {
        width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 18px;
        background: #C9A24D; color: #0B3D2E; font-size: 36px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #C9A24D; }
      p { font-size: 15px; line-height: 1.9; color: rgba(255,255,255,0.85); margin-bottom: 22px; }
      button {
        display: inline-block; width: 100%; max-width: 320px; padding: 14px 22px;
        border: 0; border-radius: 12px; background: #C9A24D; color: #0B3D2E;
        font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
      }
      button:hover { background: #d8b45e; }
      button:disabled { opacity: 0.6; cursor: wait; }
      .hint { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.55); }
      .status { margin-top: 14px; font-size: 13px; color: #C9A24D; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">ح</div>
      <h1>إعادة تعيين حماية</h1>
      <p>
        سيتم مسح خدمات العامل Service Workers والذاكرة المؤقتة (الكاش) بالكامل،
        ثم إعادة توجيهك إلى التطبيق لتحميل أحدث نسخة. استخدم هذه الصفحة عند
        ظهور شاشة بيضاء أو نسخة قديمة من الموقع.
      </p>
      <button type="button" id="reset-btn">مسح الذاكرة المؤقتة وإعادة التحميل</button>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="hint">لن تُحذف بيانات جلسة الدخول الخاصة بك من قاعدة البيانات.</div>
    </div>

    <script>
      (function () {
        var btn = document.getElementById('reset-btn');
        var statusEl = document.getElementById('status');

        function reset() {
          btn.disabled = true;
          statusEl.textContent = 'جارٍ مسح الذاكرة المؤقتة…';
          var done = false;
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var jobs = regs.map(function (r) { return r.unregister(); });
                return Promise.all(jobs);
              });
            }
          } catch (e) {}
          try {
            if (window.caches && typeof caches.keys === 'function') {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          } catch (e) {}
          // منح الوقت للعمليات غير المتزامنة، ثم التوجيه إلى التطبيق بمعامل جديد
          setTimeout(function () {
            statusEl.textContent = 'تم المسح — جارٍ التوجيه…';
            try {
              window.location.replace(window.location.pathname.replace(/\/reset\.html$/, '/') + '?fresh=' + Date.now());
            } catch (e) {
              window.location.href = './?fresh=' + Date.now();
            }
          }, 1200);
          // مهلة أمان
          setTimeout(function () {
            try { window.location.href = './?fresh=' + Date.now(); } catch (e) {}
          }, 3000);
        }

        btn.addEventListener('click', reset);
      })();
    </script>
  </body>
</html>
